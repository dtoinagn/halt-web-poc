# Halt Web Portal - Apache httpd reverse proxy (HTTPS :443, HTTP :80 redirects)
#
# Install:
#   dnf install mod_ssl            # provides mod_ssl and "Listen 443 https"
#   copy to /etc/httpd/conf.d/halt-portal.conf, then
#   apachectl configtest && systemctl reload httpd
#
# The browser only ever talks to this host on port 443. Each backend service
# gets its own path prefix, which httpd strips before forwarding:
#
#   /halt-svc/...  -> http://HALT_BACKEND:8081/...   halt API
#   /sse-svc/...   -> http://HALT_BACKEND:8085/...   SSE (ticket + stream)
#   /auth-svc/...  -> http://HALT_BACKEND:8099/...   login
#
# Everything else is the React build in /var/www/haltweb_html.
# Modules used (all in the stock RHEL httpd + mod_ssl packages): mod_ssl,
# mod_proxy, mod_proxy_http, mod_headers, mod_rewrite, mod_dir.

# Host running the backend services. Keep 127.0.0.1 when they run on this
# server; otherwise set the internal hostname.
Define HALT_BACKEND 127.0.0.1

# TLS certificate and key for this host. If the cert was issued by an
# intermediate CA, append the intermediate cert(s) to the end of HALT_CERT.
Define HALT_CERT /etc/pki/tls/certs/halt-portal.crt
Define HALT_KEY  /etc/pki/tls/private/halt-portal.key

# Don't advertise the httpd version or OS.
ServerTokens Prod
ServerSignature Off

# --- HTTP :80 - redirect everything to HTTPS ---------------------------------
<VirtualHost *:80>
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  logs/halt-portal_error.log
    CustomLog logs/halt-portal_access.log combined
</VirtualHost>

# --- HTTPS :443 --------------------------------------------------------------
<VirtualHost *:443>
    DocumentRoot /var/www/haltweb_html

    SSLEngine on
    SSLCertificateFile    ${HALT_CERT}
    SSLCertificateKeyFile ${HALT_KEY}
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyRequests Off
    ProxyPreserveHost On
    # Backends are plain HTTP; tell them the client used HTTPS so any
    # redirects or absolute URLs they build use https://.
    RequestHeader set X-Forwarded-Proto "https"

    # --- Backend services ---------------------------------------------------
    ProxyPass        /halt-svc/ http://${HALT_BACKEND}:8081/
    ProxyPassReverse /halt-svc/ http://${HALT_BACKEND}:8081/

    ProxyPass        /auth-svc/ http://${HALT_BACKEND}:8099/
    ProxyPassReverse /auth-svc/ http://${HALT_BACKEND}:8099/

    # SSE: long-lived stream, so flush every event immediately, allow a long
    # idle time, and never compress (gzip buffers the stream).
    ProxyPass        /sse-svc/ http://${HALT_BACKEND}:8085/ flushpackets=on timeout=3600
    ProxyPassReverse /sse-svc/ http://${HALT_BACKEND}:8085/
    SetEnvIf Request_URI "^/sse-svc/" no-gzip=1

    # --- React single-page app ----------------------------------------------
    <Directory /var/www/haltweb_html>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Client-side routes (e.g. /dashboard) fall back to the app shell.
        FallbackResource /index.html
    </Directory>

    # The app shell and runtime config must always be revalidated so a new
    # deploy is picked up; hashed bundles under /static can be cached forever.
    <LocationMatch "^/(index\.html|runtime-config\.js)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # --- Security headers ---------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    # Enable once the host has a CA-issued cert that browsers trust: it makes
    # browsers refuse plain HTTP (and cert warnings) for this host for a year.
    # Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  logs/halt-portal_ssl_error.log
    CustomLog logs/halt-portal_ssl_access.log combined
</VirtualHost>
