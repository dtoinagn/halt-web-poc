# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java
#
# REQUIRED PIPELINE SECRETS:
# - NEXUS_USERNAME: Nexus repository username (set as pipeline secret variable)
# - NEXUS_PASSWORD: Nexus repository password (set as pipeline secret variable)
#
# To set these in Azure DevOps:
# 1. Go to Pipelines > Edit > Variables
# 2. Add "NEXUS_USERNAME" and "NEXUS_PASSWORD" as secret variables
# 3. Lock the secret toggle for both variables
#
# SECURITY BEST PRACTICES IMPLEMENTED:
# - Credentials stored as secret variables (not in pipeline code)
# - SSL certificate verification enabled (removed -k flag)
# - Proper error handling with exit codes
# - No verbose logging that could expose secrets
# - Reliable RPM version extraction using rpm command
# - Upload status verification

trigger:
- main

pool:
  name:  'RHEL 9 Build Pool'
  demands:
  - agent.name -equals build-01-c


variables:
- name: 'artifactName'
  value: 'halt-web-portal'
- name: 'artifactRepoRootUrl'
  value: 'https://nexus.iiroc.ca/repository/rpm-stg-halt'

parameters:
  - name: 'environment'
    displayName: 'Deployment Environment'
    type: string
    default: 'dev'
    values:
    - 'dev'
    - 'qa'
    - 'prod'

stages:
  - stage: Build
    displayName: 'Build stage'
    jobs:
    - job: Build
      displayName: 'Build job'
      steps:
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            echo "Installing dependencies..."
            npm install --force

      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            set -e
            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v
            echo "Installing dependencies..."
            echo "Running build..."
            npm run build:$ENVIRONMENT || { echo "Build failed!"; exit 1; }
            echo "Listing files after npm build"
            ls -l

            # if [ ! -d "./build" ]; then
            #   echo "React build folder not found!"
            #   exit 4
            # fi
        env:
          ENVIRONMENT: ${{parameters.environment}}
      - task: Maven@4
        inputs:
          mavenPomFile: 'pom.xml'
          mavenOptions: '-Xmx3072m'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.21'
          jdkArchitectureOption: 'x64'
          publishJUnitResults: true
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          options: "-Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dhalt-web-portal.environment=${{ parameters.environment }}"
          goals: 'clean package'

      - task: CopyFiles@2
        inputs:
          Contents: '**/noarch/**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)'


      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'

  - stage: copyRpmToDev
    displayName: 'Copy rpm directly to dev server'
    jobs:
      - job: 
        steps:
        - task: DownloadPipelineArtifact@2
          inputs:
            artifactName: 'drop'
            targetPath: '.'
        - task: Bash@3
          inputs:
              targetType: 'inline'
              script: |        
                echo "Copying rpm ..."
        - task: CopyFilesOverSSH@0
          displayName: Copy rpm to target
          inputs: 
            sshEndpoint: 'stg-01-dev'
            sourceFolder:  "target/rpm/halt-web-portal/RPMS/noarch/"
            Contents: '**/*.*(rpm)'
            targetFolder: '~/rpms/'
            readyTimeout: '20000'
  - stage: publishNexus
    displayName: Publish to nexus (qa and up only)
    condition: ne('${{ parameters.environment }}', 'dev')
    jobs:
      - job: PublishToNexus
        displayName: 'Publish RPM to Nexus Repository'
        steps:
        # Download the artifacts from previous stage
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Build Artifacts'
          inputs:
            artifactName: 'drop'
            targetPath: '$(Build.ArtifactStagingDirectory)/'
            
        - task: Bash@3
          displayName: 'Validate and Extract Version Information'
          inputs:
            targetType: 'inline'
            script: |
              set -e  # Exit on error
              
              # Define paths
              RPM_DIR="$(Build.ArtifactStagingDirectory)/target/rpm/$(artifactName)/RPMS/noarch"
              
              # Validate RPM directory exists
              if [ ! -d "$RPM_DIR" ]; then
                echo "ERROR: RPM directory not found: $RPM_DIR"
                exit 1
              fi
              
              # Find RPM file and validate
              RPM_FILE=$(find "$RPM_DIR" -maxdepth 1 -name "*.rpm" -type f | head -1)
              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: No RPM file found in $RPM_DIR"
                exit 1
              fi
              
              # Validate file is readable
              if [ ! -r "$RPM_FILE" ]; then
                echo "ERROR: RPM file is not readable: $RPM_FILE"
                exit 1
              fi
              
              # Extract version using rpm command (more reliable than string parsing)
              RPM_FILENAME=$(basename "$RPM_FILE")
              VERSION=$(rpm -qp --queryformat '%{VERSION}' "$RPM_FILE")
              
              if [ -z "$VERSION" ]; then
                echo "ERROR: Could not extract version from RPM"
                exit 1
              fi
              
              # Export for use in next step
              echo "##vso[task.setvariable variable=rpmFilePath]$RPM_FILE"
              echo "##vso[task.setvariable variable=rpmFileName]$RPM_FILENAME"
              echo "##vso[task.setvariable variable=rpmVersion]$VERSION"
              
              echo "Successfully extracted version: $VERSION"
              echo "RPM File: $RPM_FILENAME"
              
        - task: Bash@3
          displayName: 'Publish RPM to Nexus'
          inputs:
            targetType: 'inline'
            script: |
              set -e  # Exit on error
              
              # Use pipeline variables for credentials (set via secret variable)
              NEXUS_URL="$(artifactRepoRootUrl)/v$(rpmVersion)/$(artifactName)"
              curl -v -k -u stg-dev:5tg-d3v --upload-file $(rpmFilePath) "$NEXUS_URL/$(rpmFileName)"
              echo "SUCCESS: RPM published to Nexus"
              echo "URL: $NEXUS_URL/$(rpmFileName)"